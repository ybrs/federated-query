[pytest]
# Collection is repository-wide on purpose - a test is found wherever it lives,
# so tests do not lose coverage by moving. What is excluded here is not our code
# at all: vendor/ holds working copies of sibling repositories (each with its own
# suite and its own virtualenv), and the rest are build or runtime trees.
#
# vendor/ matters specifically: it carries the frozen fedqrs engine, whose suite
# imports a `tests` package of its own. Collecting both roots at once gives
# pytest two different directories claiming the same module name, which fails as
# ImportPathMismatchError rather than as anything self-explanatory.
norecursedirs =
    .git
    .*
    __pycache__
    vendor
    venv
    venv32
    target
    build
    dist
    postgres-17
    postgres-data
    .duckdb-lib
    node_modules
