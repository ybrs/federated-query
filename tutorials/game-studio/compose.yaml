name: fedq-game-studio
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: tutorial
      POSTGRES_PASSWORD: tutorial
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorial -d game"]
      interval: 3s
      timeout: 3s
      retries: 40
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: support
      MYSQL_USER: tutorial
      MYSQL_PASSWORD: tutorial
      MYSQL_ROOT_PASSWORD: tutorial-root
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=tutorial mysql -h 127.0.0.1 -u tutorial support -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 60
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: gameplay
      CLICKHOUSE_USER: tutorial
      CLICKHOUSE_PASSWORD: tutorial
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:58123:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "tutorial", "--password", "tutorial", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 40
